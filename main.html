<!DOCTYPE html>
<html lang="en"><!DOCTYPE html>
<html>

<head>
	<title>Styled Table</title>

	<style>
		table {
			width: 60%;
			border-collapse: collapse;
			margin: 20px auto;
			font-family: Arial, sans-serif;
		}

		th, td {
			border: 1px solid black;
			padding: 10px;
			text-align: center;
		}

		thead {
			background-color: lightblue;
		}

		tbody tr:nth-child(even) {
			background-color: #f2f2f2;
		}
	</style>
</head>

<body>

	<table>
		<thead>
			<tr>
				<th>Student</th>
				<th>Maths</th>
				<th>Science</th>
				<th>English</th>
			</tr>
		</thead>

		<tbody>
			<tr>
				<td>Rahul</td>
				<td>92</td>
				<td>88</td>
				<td>90</td>
			</tr>

			<tr>
				<td>Priya</td>
				<td>85</td>
				<td>91</td>
				<td>87</td>
			</tr>

			<tr>
				<td>Aman</td>
				<td>78</td>
				<td>80</td>
				<td>82</td>
			</tr>
		</tbody>
	</table>

</body>

</html>

</html>
